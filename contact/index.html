<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/x-icon" href="https://symphony100.github.io/symphony/symphony.png">
  <title>Symphony</title>
  
  <!-- Material Symbols アイコン読み込み -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <style>
    :root {
      --primary: #008DBD;
      --surface: #fdfcff;
      --glass: rgba(255, 255, 255, 0.85);
      --text-main: #1a1c1e;
      --text-sub: #44474e;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; font-family: Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; background: var(--surface); color: var(--text-main); min-height: 100vh;
    }

    /* --- ヘッダー --- */
    header {
      height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
      background: var(--glass); backdrop-filter: blur(40px);
      position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid var(--primary);
    }
    .brand { display: flex; align-items: center; gap: 12px; color: var(--primary); font-weight: 900; font-size: 22px; text-decoration: none; }
    .brand img { width: 28px; height: 28px; }

    .back-btn {
      display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--primary);
      font-weight: 900; font-size: 14px; padding: 8px 16px; border-radius: 100px; background: rgba(0, 141, 189, 0.08);
      transition: transform 0.2s var(--spring), background 0.2s;
    }
    .back-btn:hover { background: rgba(0, 141, 189, 0.15); transform: scale(1.03); }

    /* --- メイン領域 --- */
    main { max-width: 850px; margin: 0 auto; padding: 40px 24px 80px; }

    .hero { text-align: center; margin-bottom: 40px; }
    .hero h1 { font-size: 40px; font-weight: 900; margin: 0 0 12px; color: var(--text-main); }
    .hero p { font-size: 16px; color: var(--text-sub); font-weight: 700; margin: 0; }

    /* 選択カードグリッド */
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .contact-card {
      background: var(--glass);
      border-radius: 36px;
      padding: 36px 28px;
      backdrop-filter: blur(40px);
      border: 3px solid transparent;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      text-decoration: none;
      color: var(--text-main);
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s var(--spring);
    }

    .contact-card:hover {
      border-color: var(--primary);
      box-shadow: 0 20px 45px rgba(0, 141, 189, 0.12);
      transform: translateY(-6px);
    }

    /* 構成：1. タイトル ➔ 2. 下にアイコン ➔ 3. 下に詳細説明 */
    .contact-card .card-title {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 20px;
      color: var(--text-main);
    }

    .contact-card .card-icon {
      font-size: 64px;
      color: var(--primary);
      margin-bottom: 16px;
      font-variation-settings: 'FILL' 1;
    }

    .contact-card .card-desc {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.6;
      font-weight: 700;
      margin: 0;
    }

    footer { background: #111; color: white; padding: 60px 24px; text-align: center; border-top: 10px solid var(--primary); margin-top: 60px; }
    footer .f-logo { font-size: 22px; font-weight: 900; margin-bottom: 16px; color: var(--primary); }

    /* スマホ画面（レスポンシブ最適化） */
    @media (max-width: 650px) {
      header { padding: 0 16px; }
      .brand span { font-size: 18px; }
      .back-btn { padding: 6px 12px; font-size: 12px; }
      
      main { padding: 24px 16px 60px; }
      .hero h1 { font-size: 28px; }
      .hero p { font-size: 14px; }

      .contact-grid {
        grid-template-columns: 1fr; /* スマホでは押しやすい1列配置 */
        gap: 16px;
      }

      .contact-card {
        padding: 28px 20px;
        border-radius: 28px;
      }
      .contact-card .card-title { font-size: 20px; margin-bottom: 16px; }
      .contact-card .card-icon { font-size: 52px; margin-bottom: 12px; }
      .contact-card .card-desc { font-size: 13px; }
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <a href="../" class="brand">
      <img src="https://symphony100.github.io/symphony/symphony.png" alt="logo">
      <span>Symphony</span>
    </a>
    <a href="../" class="back-btn">
      <span class="material-symbols-rounded">arrow_back</span>
      <span>ポータルへ戻る</span>
    </a>
  </header>

  <main>
    <div class="hero">
      <h1>お問い合わせ</h1>
      <p>ご希望のお問い合わせ方法をお選びください</p>
    </div>

    <!-- 選択カード領域（<a>タグによる直リンク） -->
    <div class="contact-grid">
      
      <!-- 1. 管理者チャット リンク -->
      <a href="../chat" class="contact-card">
        <div class="card-title">管理者チャット</div>
        <span class="material-symbols-rounded card-icon">support_agent</span>
        <p class="card-desc">管理者に直接メッセージを送信できるチャットサポートです。迅速な回答や簡単なお問い合わせに最適です。</p>
      </a>

      <!-- 2. お問い合わせフォーム リンク -->
      <a href="form" class="contact-card">
        <div class="card-title">お問い合わせフォーム</div>
        <span class="material-symbols-rounded card-icon">contact_mail</span>
        <p class="card-desc">詳細な不具合報告やご意見、返信が必要なご要望はこちらから送信できます。</p>
      </a>

    </div>
  </main>

  <footer>
    <div class="f-logo">SYMPHONY SYSTEM GROUP</div>
    <div style="font-size:12px; color:#555; font-weight: 900;">© 2024-2026 Symphony System Group. All Rights Reserved.</div>
  </footer>

</body>
</html>
