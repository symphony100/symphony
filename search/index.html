<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal</title>
  <style>
    :root {
      --md-sys-color-background: #fdfdfd;
      --md-sys-color-surface: #ffffff;
      --md-sys-color-surface-variant: #f0f3f8;
      --md-sys-color-surface-container: #f1f4f9;
      --md-sys-color-surface-container-high: #e9ecf2;
      --md-sys-color-on-surface: #1f1f1f;
      --md-sys-color-on-surface-variant: #444746;
      --md-sys-color-outline: #747775;
      --md-sys-color-outline-variant: #e0e2ec;
      --md-sys-color-primary: #0b57d0;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #d3e3fd;
      --md-sys-color-on-primary-container: #041e49;
      --md-sys-color-error: #ba1a1a;
      --md-sys-color-on-error: #ffffff;

      --elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.06), 0px 1px 2px 0px rgba(0, 0, 0, 0.04);
      --elevation-2: 0px 2px 6px 2px rgba(0, 0, 0, 0.08), 0px 1px 2px 0px rgba(0, 0, 0, 0.04);
      --elevation-3: 0px 4px 12px 3px rgba(0, 0, 0, 0.08), 0px 1px 3px 0px rgba(0, 0, 0, 0.05);

      --radius-xs: 4px;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
      --transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", sans-serif;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* ヘッダー */
    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 16px 24px;
      gap: 12px;
      position: sticky;
      top: 0;
      background: var(--md-sys-color-background);
      z-index: 20;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--md-sys-color-on-surface-variant);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .icon-btn:hover {
      background-color: rgba(0, 0, 0, 0.05);
      color: var(--md-sys-color-on-surface);
    }

    .location-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      background: var(--md-sys-color-surface-container);
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
      font-weight: 500;
    }

    /* メインコンテナ */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 20px 80px;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    /* 検索セクション */
    .search-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 4vh;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 44px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 28px;
      color: var(--md-sys-color-on-surface);
      user-select: none;
    }

    .logo span {
      color: var(--md-sys-color-primary);
    }

    .search-form {
      width: 100%;
      max-width: 640px;
      position: relative;
    }

    .search-box {
      width: 100%;
      height: 52px;
      background: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--radius-full);
      padding: 0 48px;
      font-size: 16px;
      color: var(--md-sys-color-on-surface);
      box-shadow: var(--elevation-1);
      transition: var(--transition);
      outline: none;
    }

    .search-box:hover {
      box-shadow: var(--elevation-2);
      border-color: rgba(0, 0, 0, 0.16);
    }

    .search-box:focus {
      border-color: transparent;
      box-shadow: var(--elevation-3);
    }

    .search-icon-left {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--md-sys-color-outline);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    /* アプリランチャー型 お気に入り */
    .launcher-container {
      width: 100%;
      max-width: 640px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 12px 8px;
      justify-items: center;
      margin-bottom: 44px;
      user-select: none;
    }

    .launcher-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--md-sys-color-on-surface);
      width: 80px;
      padding: 8px 4px;
      border-radius: var(--radius-md);
      transition: background-color 0.15s ease, transform 0.15s ease;
      position: relative;
      cursor: pointer;
    }

    .launcher-tile:hover {
      background-color: var(--md-sys-color-surface-container);
    }

    .launcher-tile:active {
      transform: scale(0.96);
    }

    .launcher-tile.dragging {
      opacity: 0.35;
      transform: scale(0.9);
    }

    .launcher-tile.drag-over {
      outline: 2px dashed var(--md-sys-color-primary);
      outline-offset: -2px;
    }

    .launcher-icon-circle {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-full);
      background-color: var(--md-sys-color-surface-container);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      transition: var(--transition);
      border: 1px solid rgba(0, 0, 0, 0.04);
      overflow: hidden;
      flex-shrink: 0;
    }

    .launcher-tile:hover .launcher-icon-circle {
      background-color: var(--md-sys-color-surface-container-high);
      border-color: rgba(0, 0, 0, 0.08);
    }

    .launcher-img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      border-radius: 4px;
    }

    .launcher-fallback-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--md-sys-color-primary);
      text-transform: uppercase;
    }

    .launcher-label {
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--md-sys-color-on-surface);
      line-height: 1.3;
    }

    .launcher-add-btn {
      background: none;
      border: none;
    }

    .launcher-add-circle {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-full);
      background-color: transparent;
      border: 1px dashed var(--md-sys-color-outline);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      color: var(--md-sys-color-on-surface-variant);
      transition: var(--transition);
    }

    .launcher-tile:hover .launcher-add-circle {
      border-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-primary);
      background-color: var(--md-sys-color-surface-container);
    }

    .tile-menu-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      border-radius: var(--radius-full);
      background: var(--md-sys-color-surface-container-high);
      border: none;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--md-sys-color-on-surface-variant);
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .launcher-tile:hover .tile-menu-btn {
      display: flex;
    }

    /* 今日の情報エリア */
    .info-section {
      width: 100%;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeIn 0.3s ease forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
      color: var(--md-sys-color-outline);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.8px;
    }

    .section-divider::before,
    .section-divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }

    .section-divider span {
      padding: 0 14px;
    }

    /* 天気カード */
    .weather-card {
      background: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--radius-lg);
      padding: 18px 24px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--elevation-1);
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .weather-icon-svg {
      width: 36px;
      height: 36px;
      color: var(--md-sys-color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .weather-temp {
      font-size: 30px;
      font-weight: 500;
      letter-spacing: -0.5px;
    }

    .weather-condition {
      font-size: 13.5px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .weather-meta {
      text-align: right;
    }

    .weather-location {
      font-weight: 600;
      font-size: 14.5px;
      margin-bottom: 3px;
    }

    .weather-sub {
      font-size: 12px;
      color: var(--md-sys-color-outline);
    }

    /* ニュースセクション */
    .news-group {
      margin-bottom: 28px;
    }

    .news-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 0 2px;
    }

    .news-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
    }

    .news-header-left svg {
      color: var(--md-sys-color-primary);
    }

    .news-refresh-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--md-sys-color-outline);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .news-refresh-btn:hover {
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
    }

    .news-refresh-btn.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* PC 2列 グリッド / モバイル 1列 */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    @media (max-width: 640px) {
      .news-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ニュースカード (全体がリンク) */
    .news-card {
      background: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--elevation-1);
      transition: var(--transition);
      cursor: pointer;
      height: 100%;
    }

    .news-card:hover {
      box-shadow: var(--elevation-2);
      border-color: rgba(0, 0, 0, 0.18);
      transform: translateY(-2px);
      background-color: var(--md-sys-color-surface-container);
    }

    .news-card:active {
      transform: translateY(0);
    }

    .news-title {
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 8px;
      color: var(--md-sys-color-on-surface);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .news-desc {
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.5;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-grow: 1;
    }

    .news-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--md-sys-color-outline);
      margin-top: auto;
      padding-top: 6px;
    }

    .news-footer-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .news-tag {
      font-weight: 500;
      color: var(--md-sys-color-primary);
    }

    .news-time {
      color: var(--md-sys-color-outline);
      font-size: 11.5px;
    }

    /* もっと見るボタン */
    .news-more-container {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }

    .news-more-btn {
      height: 36px;
      padding: 0 20px;
      border-radius: var(--radius-full);
      background-color: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }

    .news-more-btn:hover {
      background-color: var(--md-sys-color-surface-container-high);
      border-color: rgba(0,0,0,0.2);
    }

    /* コンテキストポップアップメニュー */
    .context-menu {
      position: fixed;
      background: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--radius-sm);
      box-shadow: var(--elevation-2);
      padding: 6px 0;
      z-index: 150;
      min-width: 120px;
      display: none;
    }

    .context-menu.active {
      display: block;
    }

    .context-menu-item {
      padding: 8px 16px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--md-sys-color-on-surface);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .context-menu-item:hover {
      background: var(--md-sys-color-surface-container);
    }

    .context-menu-item.danger {
      color: var(--md-sys-color-error);
    }

    /* 設定ドロワー */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(2px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 360px;
      background: var(--md-sys-color-surface);
      z-index: 101;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: var(--elevation-3);
    }

    .drawer.active {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }

    .drawer-title {
      font-size: 18px;
      font-weight: 600;
    }

    .drawer-body {
      padding: 24px 20px;
      overflow-y: auto;
      flex: 1;
    }

    .setting-group {
      margin-bottom: 28px;
    }

    .setting-group-title {
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--md-sys-color-primary);
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }

    .setting-item-label {
      font-size: 14px;
      font-weight: 500;
    }

    .setting-item-sub {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      margin-top: 2px;
    }

    /* スイッチ */
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 28px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--md-sys-color-surface-variant);
      border: 2px solid var(--md-sys-color-outline);
      border-radius: var(--radius-full);
      transition: var(--transition);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 4px;
      bottom: 4px;
      background-color: var(--md-sys-color-outline);
      border-radius: 50%;
      transition: var(--transition);
    }

    input:checked + .slider {
      background-color: var(--md-sys-color-primary);
      border-color: var(--md-sys-color-primary);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
      background-color: var(--md-sys-color-on-primary);
      height: 20px;
      width: 20px;
      left: 2px;
      bottom: 2px;
    }

    .select-input, .text-input {
      width: 100%;
      height: 44px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface);
      padding: 0 12px;
      font-size: 14px;
      color: var(--md-sys-color-on-surface);
      margin-top: 8px;
      outline: none;
      transition: var(--transition);
    }

    .select-input:focus, .text-input:focus {
      border-color: var(--md-sys-color-primary);
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 120;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 400px;
      background: var(--md-sys-color-surface);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--elevation-3);
      transform: scale(0.95);
      transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    .btn {
      height: 38px;
      padding: 0 18px;
      border-radius: var(--radius-full);
      font-size: 14px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .btn-tonal {
      background-color: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
    }

    .btn-tonal:hover {
      background-color: var(--md-sys-color-surface-container-high);
    }

    .btn-filled {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }

    .btn-filled:hover {
      opacity: 0.92;
    }

    .btn-danger {
      background-color: var(--md-sys-color-error);
      color: var(--md-sys-color-on-error);
    }

    /* レスポンシブ調整 */
    @media (max-width: 600px) {
      .logo {
        font-size: 34px;
        margin-bottom: 20px;
      }
      .search-section {
        margin-top: 2vh;
        margin-bottom: 24px;
      }
      .launcher-container {
        grid-template-columns: repeat(4, 1fr);
        gap: 10px 4px;
        margin-bottom: 36px;
      }
      .launcher-tile {
        width: 100%;
        max-width: 76px;
      }
      .drawer {
        max-width: 86%;
      }
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <div id="locationBadge" class="location-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/>
      </svg>
      <span id="badgeLocationText">読込中</span>
    </div>
    <button id="openSettingsBtn" class="icon-btn" aria-label="設定">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">

    /* 永続化キー */
    const STORAGE_KEY_SETTINGS = "portal_settings_v5";
    const STORAGE_KEY_SHORTCUTS = "portal_shortcuts_v5";
    const STORAGE_KEY_INTERESTS = "portal_news_interests_v2";

    /* アプリ状態 */

      showWeather: true,
      showNews: true,
      personalizeNews: true,
      useGeolocation: true,
      manualPrefId: "yamanashi"

    function init() {
      populatePrefectureSelect();
      loadSettings();
      loadShortcuts();
      loadInterests();
      setupEventListeners();
      renderShortcuts();
      applySettingsToUI();
      resolveLocationAndRefresh();

      // 定期自動更新（15分間隔）

      }, 15 * 60 * 1000);

    function populatePrefectureSelect() {
      const select = document.getElementById("manualPrefSelect");
      select.innerHTML = "";
      PREFECTURES.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.name;
        select.appendChild(opt);
      });
    }

    function loadSettings() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY_SETTINGS);
        if (stored) settings = { ...settings, ...JSON.parse(stored) };
      } catch (e) {}
    }

    function saveSettings() {
      try {
        localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
      } catch (e) {}
      applySettingsToUI();
    }

    function loadShortcuts() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY_SHORTCUTS);
        shortcuts = stored ? JSON.parse(stored) : [...DEFAULT_SHORTCUTS];
      } catch (e) {
        shortcuts = [...DEFAULT_SHORTCUTS];
      }
    }

    function saveShortcuts() {
      try {
        localStorage.setItem(STORAGE_KEY_SHORTCUTS, JSON.stringify(shortcuts));
      } catch (e) {}
      renderShortcuts();
    }

    function loadInterests() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY_INTERESTS);
        interestLogs = stored ? JSON.parse(stored) : [];
      } catch (e) {
        interestLogs = [];
      }
    }

    function recordNewsClick(article) {
      if (!article || !article.category) return;
      interestLogs.push({
        id: article.id,
        category: article.category,
        timestamp: Date.now()
      });

      if (interestLogs.length > 50) interestLogs = interestLogs.slice(-50);

      try {
        localStorage.setItem(STORAGE_KEY_INTERESTS, JSON.stringify(interestLogs));
      } catch (e) {}

      // 次回再訪時・更新時に最適化
    }

    function calculateCategoryScores() {
      const scores = {};
      const now = Date.now();
      const halfLifeMs = 7 * 24 * 60 * 60 * 1000;

      interestLogs.forEach(log => {
        const age = Math.max(0, now - log.timestamp);
        const weight = Math.pow(0.5, age / halfLifeMs);
        scores[log.category] = (scores[log.category] || 0) + weight;
      });

      return scores;
    }

    /* 相対時間の計算 */
    function formatTimeAgo(isoString) {
      const diffMs = Date.now() - new Date(isoString).getTime();
      const diffMin = Math.floor(diffMs / (60 * 1000));
      const diffHour = Math.floor(diffMin / 60);
      const diffDay = Math.floor(diffHour / 24);

      if (diffMin < 1) return "たった今";
      if (diffMin < 60) return `${diffMin}分前`;
      if (diffHour < 24) return `${diffHour}時間前`;
      if (diffDay < 7) return `${diffDay}日前`;
      return new Date(isoString).toLocaleDateString("ja-JP");
    }

    /* 最寄り都道府県判定（外部送信なし） */
    function findNearestPrefecture(lat, lon) {
      let nearest = PREFECTURES[0];
      let minDistance = Infinity;

      PREFECTURES.forEach(p => {
        const dLat = p.lat - lat;
        const dLon = p.lon - lon;
        const dist = dLat * dLat + dLon * dLon;
        if (dist < minDistance) {
          minDistance = dist;
          nearest = p;
        }
      });
      return nearest;
    }

    function resolveLocationAndRefresh() {
      const badge = document.getElementById("badgeLocationText");

      if (settings.useGeolocation && navigator.geolocation) {
        badge.textContent = "判定中";
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            currentPref = findNearestPrefecture(pos.coords.latitude, pos.coords.longitude);
            badge.textContent = currentPref.name;
            fetchWeather(pos.coords.latitude, pos.coords.longitude, currentPref.name);
            renderNews(currentPref.name);
          },
          () => {
            applyManualPrefecture();
          },
          { timeout: 7000 }
        );
      } else {
        applyManualPrefecture();
      }
    }

    function applyManualPrefecture() {
      const target = PREFECTURES.find(p => p.id === settings.manualPrefId) || PREFECTURES[18];
      currentPref = target;
      document.getElementById("badgeLocationText").textContent = target.name;
      fetchWeather(target.lat, target.lon, target.name);
      renderNews(target.name);
    }

    async function fetchWeather(lat, lon, prefName) {
      const tempEl = document.getElementById("weatherTemp");
      const descEl = document.getElementById("weatherDesc");
      const iconEl = document.getElementById("weatherIcon");
      const locEl = document.getElementById("weatherLocation");
      const rangeEl = document.getElementById("weatherRange");

      locEl.textContent = prefName;

      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("API error");

        const data = await res.json();
        const cur = data.current_weather;
        const daily = data.daily;

        const info = mapWeatherCode(cur.weathercode);
        tempEl.textContent = Math.round(cur.temperature);
        descEl.textContent = info.desc;
        iconEl.innerHTML = info.svg;

        if (daily && daily.temperature_2m_max) {
          const max = Math.round(daily.temperature_2m_max[0]);
          const min = Math.round(daily.temperature_2m_min[0]);
          rangeEl.textContent = `最高 ${max}° / 最低 ${min}°`;
        }
      } catch (e) {
        tempEl.textContent = "21";
        descEl.textContent = "晴れ";
        iconEl.innerHTML = WEATHER_SVGS.clear;
        rangeEl.textContent = "最高 23° / 最低 15°";
      }
    }

    function mapWeatherCode(code) {
      if (code === 0) return { desc: "快晴", svg: WEATHER_SVGS.clear };
      if ([1, 2].includes(code)) return { desc: "晴れ時々曇り", svg: WEATHER_SVGS.partlyCloudy };
      if (code === 3) return { desc: "曇り", svg: WEATHER_SVGS.cloudy };
      if ([51, 53, 55, 61, 63, 65, 80, 81].includes(code)) return { desc: "雨", svg: WEATHER_SVGS.rain };
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { desc: "雪", svg: WEATHER_SVGS.snow };
      if ([95, 96, 99].includes(code)) return { desc: "雷雨", svg: WEATHER_SVGS.thunder };
      return { desc: "晴れ", svg: WEATHER_SVGS.clear };
    }

    /* ニュースの取得・ソート・描画（重複排除・新しい順優先） */
    function renderNews(prefName) {
      const localContainer = document.getElementById("localNewsList");
      const localGroup = document.getElementById("localNewsGroup");
      const localTitle = document.getElementById("localNewsTitle");

      const personalizedContainer = document.getElementById("personalizedNewsList");
      const personalizedGroup = document.getElementById("personalizedNewsGroup");

      const nationalContainer = document.getElementById("nationalNewsList");
      const nationalGroup = document.getElementById("nationalNewsGroup");
      const moreBtnContainer = document.getElementById("newsMoreContainer");

      localContainer.innerHTML = "";
      personalizedContainer.innerHTML = "";
      nationalContainer.innerHTML = "";

      // 既出IDトラッカー（重複排除用）
      const seenIds = new Set();
      const seenUrls = new Set();

      function deduplicate(list) {
        return list.filter(item => {
          if (!item.id || !item.url) return false;
          if (seenIds.has(item.id) || seenUrls.has(item.url)) return false;
          seenIds.add(item.id);
          seenUrls.add(item.url);
          return true;
        });
      }

      // 1. 地域ニュース（新しい順にソート）
      const rawLocal = REGIONAL_NEWS_DATA[prefName] || [];
      const sortedLocal = deduplicate([...rawLocal].sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt)));

      if (sortedLocal.length > 0) {
        localGroup.style.display = "block";
        localTitle.textContent = `${prefName}のニュース`;
        sortedLocal.slice(0, 2).forEach(item => {
          localContainer.appendChild(createNewsCard(item));
        });
      } else {
        localGroup.style.display = "none";
      }

      // 2. 全国／一般ニュース（重複を排除して新しい順にソート）
      const sortedGeneral = deduplicate([...NATIONAL_NEWS_DATA].sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt)));

      // 3. パーソナライズの評価
      const categoryScores = calculateCategoryScores();
      const isPersonalizedActive = settings.personalizeNews && interestLogs.length >= 2;

      let remainingArticles = [];

      if (isPersonalizedActive) {
        // スコア順に重み付けして抽出
        const scored = [...sortedGeneral].sort((a, b) => {
          const scoreA = categoryScores[a.category] || 0;
          const scoreB = categoryScores[b.category] || 0;
          return scoreB - scoreA;
        });

        const topPersonalized = [];
        const seenCatCount = {};

        scored.forEach(item => {
          const count = seenCatCount[item.category] || 0;
          if (topPersonalized.length < 2 && count < 2 && (categoryScores[item.category] || 0) > 0.4) {
            topPersonalized.push(item);
            seenCatCount[item.category] = count + 1;
          } else {
            remainingArticles.push(item);
          }
        });

        if (topPersonalized.length > 0) {
          personalizedGroup.style.display = "block";
          topPersonalized.forEach(item => {
            personalizedContainer.appendChild(createNewsCard(item));
          });
        } else {
          personalizedGroup.style.display = "none";
        }
      } else {
        personalizedGroup.style.display = "none";
        remainingArticles = sortedGeneral;
      }

      // 4. 全国ニュースの描画（ページネーション制御）
      const visibleArticles = remainingArticles.slice(0, visibleNationalCount);
      visibleArticles.forEach(item => {
        nationalContainer.appendChild(createNewsCard(item));
      });

      // もっと見るボタンの表示/非表示
      if (remainingArticles.length > visibleNationalCount) {
        moreBtnContainer.style.display = "flex";
      } else {
        moreBtnContainer.style.display = "none";
      }
    }

    /* ニュースカード生成（全体が<a>タグ、固有URLリンク） */
    function createNewsCard(item) {
      const card = document.createElement("a");
      card.className = "news-card";
      card.href = item.url;
      card.target = "_blank";
      card.rel = "noopener noreferrer";

      const timeAgo = formatTimeAgo(item.publishedAt);

      card.innerHTML = `
        <h3 class="news-title">${escapeHtml(item.title)}</h3>
        <p class="news-desc">${escapeHtml(item.description)}</p>
        <div class="news-footer">
          <div class="news-footer-left">
            <span class="news-tag">${escapeHtml(item.source)}</span>
          </div>
          <span class="news-time">${escapeHtml(timeAgo)}</span>
        </div>
      `;

      // クリック時にパーソナライズ傾向を更新
      card.addEventListener("click", () => {
        recordNewsClick(item);
      });

      return card;
    }

    /* 手動更新ハンドラー */
    function refreshNewsData(animate = true) {
      const btn = document.getElementById("refreshNewsBtn");
      if (animate && btn) btn.classList.add("spinning");

      setTimeout(() => {
        renderNews(currentPref.name);
        if (btn) btn.classList.remove("spinning");
      }, 350);
    }

    /* お気に入りランチャー描画 */
    function renderShortcuts() {
      const container = document.getElementById("launcherContainer");
      container.innerHTML = "";

      shortcuts.forEach((item, index) => {
        const tile = document.createElement("a");
        tile.className = "launcher-tile";
        tile.href = item.url;
        tile.draggable = true;
        tile.dataset.index = index;

        const domain = getDomain(item.url);
        const faviconUrl = domain ? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64` : "";
        const initial = (item.title || "W").charAt(0);

        tile.innerHTML = `
          <div class="launcher-icon-circle">
            <img class="launcher-img" src="${faviconUrl}" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <span class="launcher-fallback-text" style="display:none;">${escapeHtml(initial)}</span>
          </div>
          <span class="launcher-label">${escapeHtml(item.title)}</span>
          <button type="button" class="tile-menu-btn" aria-label="操作メニュー" title="メニュー">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
          </button>
        `;

        tile.addEventListener("dragstart", (e) => {
          draggedTileIndex = index;
          tile.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
        });

        tile.addEventListener("dragend", () => {
          tile.classList.remove("dragging");
          document.querySelectorAll(".launcher-tile").forEach(el => el.classList.remove("drag-over"));
        });

        tile.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          tile.classList.add("drag-over");
        });

        tile.addEventListener("dragleave", () => {
          tile.classList.remove("drag-over");
        });

        tile.addEventListener("drop", (e) => {
          e.preventDefault();
          tile.classList.remove("drag-over");
          if (draggedTileIndex === null || draggedTileIndex === index) return;

          const movedItem = shortcuts.splice(draggedTileIndex, 1)[0];
          shortcuts.splice(index, 0, movedItem);
          draggedTileIndex = null;
          saveShortcuts();
        });

        const menuBtn = tile.querySelector(".tile-menu-btn");
        menuBtn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          openContextMenu(e.clientX, e.clientY, item);
        });

        tile.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          openContextMenu(e.clientX, e.clientY, item);
        });

        container.appendChild(tile);
      });

      const addTile = document.createElement("button");
      addTile.type = "button";
      addTile.className = "launcher-tile launcher-add-btn";
      addTile.innerHTML = `
        <div class="launcher-add-circle">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
        </div>
        <span class="launcher-label">追加</span>
      `;
      addTile.addEventListener("click", () => openShortcutModal());
      container.appendChild(addTile);
    }

    function getDomain(urlStr) {
      try {
        const u = new URL(urlStr.startsWith("http") ? urlStr : `https://${urlStr}`);
        return u.hostname;
      } catch (e) {
        return "";
      }
    }

    const contextMenu = document.getElementById("contextMenu");

    function openContextMenu(x, y, item) {
      activeTargetShortcut = item;
      contextMenu.style.left = `${Math.min(x, window.innerWidth - 130)}px`;
      contextMenu.style.top = `${Math.min(y, window.innerHeight - 90)}px`;
      contextMenu.classList.add("active");
    }

    function closeContextMenu() {
      contextMenu.classList.remove("active");
    }

    document.addEventListener("click", () => closeContextMenu());

    document.getElementById("contextEdit").addEventListener("click", (e) => {
      e.stopPropagation();
      closeContextMenu();
      if (activeTargetShortcut) openShortcutModal(activeTargetShortcut);
    });

    document.getElementById("contextDelete").addEventListener("click", (e) => {
      e.stopPropagation();
      closeContextMenu();
      if (activeTargetShortcut) openDeleteModal(activeTargetShortcut);
    });

    const shortcutModal = document.getElementById("shortcutModalOverlay");
    const shortcutModalTitle = document.getElementById("shortcutModalTitle");
    const nameInput = document.getElementById("shortcutNameInput");
    const urlInput = document.getElementById("shortcutUrlInput");

    const deleteModal = document.getElementById("deleteModalOverlay");
    const deleteConfirmText = document.getElementById("deleteConfirmText");

    let editingShortcutId = null;

    function openShortcutModal(item = null) {
      if (item) {
        editingShortcutId = item.id;
        shortcutModalTitle.textContent = "お気に入りを編集";
        nameInput.value = item.title;
        urlInput.value = item.url;
      } else {
        editingShortcutId = null;
        shortcutModalTitle.textContent = "お気に入りを追加";
        nameInput.value = "";
        urlInput.value = "";
      }
      shortcutModal.classList.add("active");
      nameInput.focus();
    }

    function closeShortcutModal() {
      shortcutModal.classList.remove("active");
      editingShortcutId = null;
    }

    function openDeleteModal(item) {
      activeTargetShortcut = item;
      deleteConfirmText.textContent = `「${item.title}」をお気に入りから削除しますか？`;
      deleteModal.classList.add("active");
    }

    function closeDeleteModal() {
      deleteModal.classList.remove("active");
    }

    function setupEventListeners() {
      const form = document.getElementById("searchForm");
      const searchInput = document.getElementById("searchInput");
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const query = searchInput.value.trim();
        if (query) {
          window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
        }
      });

      const drawer = document.getElementById("settingsDrawer");
      const overlay = document.getElementById("drawerOverlay");
      const openBtn = document.getElementById("openSettingsBtn");
      const closeBtn = document.getElementById("closeSettingsBtn");

      function openDrawer() {
        drawer.classList.add("active");
        overlay.classList.add("active");
        drawer.setAttribute("aria-hidden", "false");
      }

      function closeDrawer() {
        drawer.classList.remove("active");
        overlay.classList.remove("active");
        drawer.setAttribute("aria-hidden", "true");
      }

      openBtn.addEventListener("click", openDrawer);
      closeBtn.addEventListener("click", closeDrawer);
      overlay.addEventListener("click", closeDrawer);

      // ニュース更新ボタン & もっと見る
      document.getElementById("refreshNewsBtn").addEventListener("click", () => {
        refreshNewsData(true);
      });

      document.getElementById("newsMoreBtn").addEventListener("click", () => {
        visibleNationalCount += PAGE_SIZE;
        renderNews(currentPref.name);
      });

      document.getElementById("cancelShortcutBtn").addEventListener("click", closeShortcutModal);
      document.getElementById("saveShortcutBtn").addEventListener("click", () => {
        const title = nameInput.value.trim();
        let url = urlInput.value.trim();
        if (!title || !url) return;

        if (!/^https?:\/\//i.test(url)) url = `https://${url}`;

        if (editingShortcutId) {
          const target = shortcuts.find(s => s.id === editingShortcutId);
          if (target) {
            target.title = title;
            target.url = url;
          }
        } else {
          shortcuts.push({ id: `sc_${Date.now()}`, title, url });
        }

        saveShortcuts();
        closeShortcutModal();
      });

      document.getElementById("cancelDeleteBtn").addEventListener("click", closeDeleteModal);
      document.getElementById("confirmDeleteBtn").addEventListener("click", () => {
        if (activeTargetShortcut) {
          shortcuts = shortcuts.filter(s => s.id !== activeTargetShortcut.id);
          saveShortcuts();
        }
        closeDeleteModal();
      });

      document.getElementById("toggleWeather").addEventListener("change", (e) => {
        settings.showWeather = e.target.checked;
        saveSettings();
      });

      document.getElementById("toggleNews").addEventListener("change", (e) => {
        settings.showNews = e.target.checked;
        saveSettings();
      });

      document.getElementById("togglePersonalized").addEventListener("change", (e) => {
        settings.personalizeNews = e.target.checked;
        saveSettings();
        renderNews(currentPref.name);
      });

      document.getElementById("toggleGeolocation").addEventListener("change", (e) => {
        settings.useGeolocation = e.target.checked;
        saveSettings();
        resolveLocationAndRefresh();
      });

      document.getElementById("manualPrefSelect").addEventListener("change", (e) => {
        settings.manualPrefId = e.target.value;
        saveSettings();
        if (!settings.useGeolocation) {
          applyManualPrefecture();
        }
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeDrawer();
          closeShortcutModal();
          closeDeleteModal();
          closeContextMenu();
        }
      });
    }

    function applySettingsToUI() {
      document.getElementById("toggleWeather").checked = settings.showWeather;
      document.getElementById("toggleNews").checked = settings.showNews;
      document.getElementById("togglePersonalized").checked = settings.personalizeNews;
      document.getElementById("toggleGeolocation").checked = settings.useGeolocation;
      document.getElementById("manualPrefSelect").value = settings.manualPrefId;

      const manualContainer = document.getElementById("manualRegionContainer");
      const geoSub = document.getElementById("geoSubLabel");
      const prefSelect = document.getElementById("manualPrefSelect");

      if (settings.useGeolocation) {
        geoSub.textContent = "現在地から自動取得中";
        prefSelect.disabled = true;
        manualContainer.style.opacity = "0.4";
      } else {
        geoSub.textContent = "手動設定の地域を使用";
        prefSelect.disabled = false;
        manualContainer.style.opacity = "1";
      }

      document.getElementById("weatherBlock").style.display = settings.showWeather ? "block" : "none";
      document.getElementById("newsBlock").style.display = settings.showNews ? "block" : "none";

      const infoSection = document.getElementById("infoSection");
      infoSection.style.display = (!settings.showWeather && !settings.showNews) ? "none" : "block";
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
