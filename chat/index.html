<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/x-icon" href="https://symphony100.github.io/symphony/symphony.png">
  <title>Symphony Chat - 管理者監視対応</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <!-- 通信ライブラリ (設定なしで即動作) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --primary: #008DBD;
      --on-primary: #ffffff;
      --surface: #f4f6f9;
      --surface-variant: #e0e2ec;
      --glass: rgba(255, 255, 255, 0.9);
      --glass-card: #ffffff;
      --text-main: #1a1c1e;
      --text-sub: #6e747a;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; font-family: Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
      margin: 0; background: var(--surface); color: var(--text-main); 
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* --- ヘッダー --- */
    header {
      height: 60px; display: flex; align-items: center; padding: 0 16px; gap: 10px;
      background: var(--glass); backdrop-filter: blur(20px);
      position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--primary);
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 8px; color: var(--primary); font-weight: 900; font-size: 18px; text-decoration: none; }
    .brand img { width: 26px; height: 26px; }

    .role-badge { font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 20px; background: rgba(0,141,189,0.1); color: var(--primary); }
    .role-badge.admin { background: #fff0f0; color: #d32f2f; border: 1px solid #ffcdd2; }

    .notify-btn { border: none; background: #e8f5e9; color: #2e7d32; font-size: 11px; font-weight: bold; padding: 6px 10px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 4px; }

    /* --- アプリレイアウト --- */
    .app-body { flex: 1; display: flex; overflow: hidden; }

    /* サイドバー (管理者時のユーザー一覧) */
    .sidebar {
      width: 240px; background: #ffffff; border-right: 1px solid var(--surface-variant);
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sidebar-header { padding: 12px; font-size: 12px; font-weight: bold; color: var(--text-sub); border-bottom: 1px solid var(--surface-variant); background: #f8f9fa; }
    .user-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
    
    .user-item {
      display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px;
      cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s;
    }
    .user-item:hover, .user-item.active { background: rgba(0,141,189,0.08); color: var(--primary); }

    /* メインチャットエリア */
    main { flex: 1; display: flex; flex-direction: column; padding: 10px; overflow: hidden; background: var(--surface); }

    #chat-container {
      flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth;
    }

    /* メッセージ要素 */
    .msg-group { display: flex; flex-direction: column; max-width: 80%; animation: popIn 0.2s var(--spring); }
    .msg-group.me { align-self: flex-end; align-items: flex-end; }
    .msg-group.other { align-self: flex-start; align-items: flex-start; }

    .msg-sender { font-size: 11px; font-weight: bold; color: var(--text-sub); margin-bottom: 3px; padding: 0 4px; }
    
    .msg-wrapper { display: flex; align-items: flex-end; gap: 6px; }
    .msg-group.me .msg-wrapper { flex-direction: row-reverse; }

    .msg-bubble {
      padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4;
      word-break: break-word; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .msg-group.me .msg-bubble { background: var(--primary); color: var(--on-primary); border-bottom-right-radius: 4px; }
    .msg-group.other .msg-bubble { background: var(--glass-card); color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid #e0e2ec; }

    .msg-meta { font-size: 10px; color: var(--text-sub); display: flex; flex-direction: column; align-items: flex-end; }
    .msg-read { color: var(--primary); font-weight: bold; }

    .msg-img { max-width: 200px; max-height: 180px; border-radius: 12px; margin-top: 4px; cursor: pointer; object-fit: cover; }
    .msg-file { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.05); padding: 6px 10px; border-radius: 10px; text-decoration: none; color: inherit; font-size: 12px; font-weight: bold; }

    .del-btn { border: none; background: none; color: #aaa; cursor: pointer; padding: 2px; }
    .del-btn:hover { color: #ff4d4d; }

    @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    /* --- 入力バー --- */
    .input-bar {
      display: flex; align-items: center; gap: 8px; padding: 6px 12px;
      background: var(--glass-card); border-radius: 28px; border: 1px solid #d0d4dc;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: 6px; flex-shrink: 0;
    }
    .input-bar input[type="text"] { flex: 1; border: none; background: transparent; padding: 8px; font-size: 14px; outline: none; }
    .icon-btn { border: none; background: none; color: var(--primary); cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }

    /* モーダル */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
    .dialog { background: white; width: 90%; max-width: 360px; padding: 24px; border-radius: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; font-weight: bold; color: var(--text-sub); margin-bottom: 4px; display: block; }
    .form-input { width: 100%; padding: 10px 12px; border-radius: 12px; border: 2px solid #e0e2ec; outline: none; font-size: 14px; font-weight: bold; }
    .form-input:focus { border-color: var(--primary); }
    .btn { width: 100%; padding: 12px; border-radius: 100px; border: none; background: var(--primary); color: white; font-weight: bold; font-size: 14px; cursor: pointer; }

    @media (max-width: 600px) {
      .sidebar { width: 100px; }
    }
  </style>
</head>
<body>

<header>
  <a href="#" class="brand">
    <img src="https://symphony100.github.io/symphony/symphony.png" alt="logo">
    <span>Symphony</span>
  </a>
  <div style="flex:1"></div>
  <button class="notify-btn" onclick="enableNotification()">
    <span class="material-symbols-rounded" style="font-size:16px;">notifications</span>
    <span>通知許可</span>
  </button>
  <div id="roleDisplay" class="role-badge">...</div>
</header>

<div class="app-body">
  <!-- 管理者用サイドバー (全メッセージ閲覧用) -->
  <div class="sidebar" id="adminSidebar" style="display:none;">
    <div class="sidebar-header">🛡️ 閲覧ユーザー切り替え</div>
    <div class="user-list" id="userList">
      <div class="user-item active" onclick="filterUser('ALL')">全発言ログ一覧</div>
    </div>
  </div>

  <main>
    <div id="chat-container"></div>

    <div class="input-bar">
      <button class="icon-btn" onclick="document.getElementById('fileInput').click()"><span class="material-symbols-rounded">attach_file</span></button>
      <input type="file" id="fileInput" style="display:none" onchange="sendFile(this)">
      
      <input type="text" id="msgInput" placeholder="メッセージを入力..." onkeydown="if(event.key==='Enter') sendText()">
      <button class="icon-btn" style="background:var(--primary); color:white; width:36px; height:36px;" onclick="sendText()">
        <span class="material-symbols-rounded" style="font-size:18px;">send</span>
      </button>
    </div>
  </main>
</div>

<!-- 初回設定モーダル -->
<div id="loginModal" class="overlay">
  <div class="dialog">
    <h3 style="margin:0 0 16px 0; color:var(--primary);">チャットを開始</h3>
    
    <div class="form-group">
      <label class="form-label">名前</label>
      <input type="text" id="initName" class="form-input" placeholder="名前を入力">
    </div>

    <div class="form-group">
      <label class="form-label">役割</label>
      <select id="initRole" class="form-input" onchange="togglePass(this.value)">
        <option value="user">一般ユーザー</option>
        <option value="admin">管理者</option>
      </select>
    </div>

    <div class="form-group" id="passGroup" style="display:none;">
      <label class="form-label" style="color:#d32f2f;">管理者パスワード (2024)</label>
      <input type="password" id="initPass" class="form-input" placeholder="パスワードを入力">
    </div>

    <button class="btn" onclick="startApp()">決定して始める</button>
  </div>
</div>

<script>
  let myProfile = null;
  let peer = null;
  let adminConn = null;
  let userConns = {}; 
  let allMessages = []; // 全発言ログ
  let currentFilter = 'ALL';

  const ADMIN_PEER_ID = "symphony-sys-admin-watch-v2";

  function togglePass(role) {
    document.getElementById('passGroup').style.display = (role === 'admin') ? 'block' : 'none';
  }

  function startApp() {
    const name = document.getElementById('initName').value.trim();
    const role = document.getElementById('initRole').value;
    const pass = document.getElementById('initPass').value;

    if (!name) return alert('名前を入力してください');
    if (role === 'admin' && pass !== '2024') return alert('管理者パスワードが違います');

    myProfile = {
      uid: 'u_' + Math.random().toString(36).substr(2, 7),
      name: name,
      role: role
    };

    document.getElementById('loginModal').style.display = 'none';
    const badge = document.getElementById('roleDisplay');
    
    if (role === 'admin') {
      badge.innerText = '🛡️ 管理者 (監視中)';
      badge.classList.add('admin');
      document.getElementById('adminSidebar').style.display = 'flex';
    } else {
      badge.innerText = '一般ユーザー';
    }

    setupNetwork();
  }

  // --- 通信処理 ---
  function setupNetwork() {
    if (myProfile.role === 'admin') {
      // 管理者は全ユーザーの発言を受信・中継
      peer = new Peer(ADMIN_PEER_ID);

      peer.on('connection', (conn) => {
        conn.on('data', (data) => {
          if (data.type === 'login') {
            userConns[data.uid] = conn;
            addUserToSidebar(data.uid, data.name);
          } else if (data.type === 'msg') {
            receiveMessage(data.msg);
            broadcast(data); // 他のユーザーへ中継
          } else if (data.type === 'del') {
            deleteLocalMsg(data.id);
            broadcast(data);
          }
        });
      });
    } else {
      // 一般ユーザー
      peer = new Peer('user_' + myProfile.uid);

      peer.on('open', () => {
        connectToAdmin();
      });
    }
  }

  function connectToAdmin() {
    adminConn = peer.connect(ADMIN_PEER_ID);
    adminConn.on('open', () => {
      adminConn.send({ type: 'login', uid: myProfile.uid, name: myProfile.name });
    });

    adminConn.on('data', (data) => {
      if (data.type === 'msg') receiveMessage(data.msg);
      if (data.type === 'del') deleteLocalMsg(data.id);
    });

    // 接続が切れたら自動再接続
    adminConn.on('close', () => setTimeout(connectToAdmin, 2000));
  }

  function broadcast(data) {
    Object.values(userConns).forEach(c => { if (c.open) c.send(data); });
  }

  // --- 送信機能 ---
  function sendText() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;

    postMessage({ text });
    input.value = '';
  }

  function sendFile(input) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      postMessage({
        file: {
          name: file.name,
          isImg: file.type.startsWith('image/'),
          url: e.target.result
        }
      });
    };
    reader.readAsDataURL(file);
    input.value = '';
  }

  function postMessage(payload) {
    const msg = {
      id: 'm_' + Date.now(),
      senderId: myProfile.uid,
      senderName: myProfile.name,
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      ...payload
    };

    receiveMessage(msg); // 自分の画面へ反映

    const packet = { type: 'msg', msg };
    if (myProfile.role === 'admin') {
      broadcast(packet);
    } else if (adminConn && adminConn.open) {
      adminConn.send(packet);
    }
  }

  function receiveMessage(msg) {
    allMessages.push(msg);
    if (myProfile.role === 'admin') {
      addUserToSidebar(msg.senderId, msg.senderName);
    }
    renderMessages();

    // 通知を飛ばす
    if (msg.senderId !== myProfile.uid) {
      triggerNotification(msg.senderName, msg.text || 'ファイルが送信されました');
    }
  }

  function deleteMsg(id) {
    if (!confirm('メッセージを削除しますか？')) return;
    deleteLocalMsg(id);

    const packet = { type: 'del', id };
    if (myProfile.role === 'admin') {
      broadcast(packet);
    } else if (adminConn && adminConn.open) {
      adminConn.send(packet);
    }
  }

  function deleteLocalMsg(id) {
    allMessages = allMessages.filter(m => m.id !== id);
    renderMessages();
  }

  // --- 管理者用サイドバー管理 ---
  function addUserToSidebar(uid, name) {
    const list = document.getElementById('userList');
    if (document.getElementById(`uitem_${uid}`)) return;

    const item = document.createElement('div');
    item.id = `uitem_${uid}`;
    item.className = 'user-item';
    item.innerText = '👤 ' + name;
    item.onclick = () => filterUser(uid);
    list.appendChild(item);
  }

  function filterUser(uid) {
    currentFilter = uid;
    document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
    if (uid === 'ALL') {
      document.querySelector('.user-item').classList.add('active');
    } else {
      const target = document.getElementById(`uitem_${uid}`);
      if (target) target.classList.add('active');
    }
    renderMessages();
  }

  // --- 描画レンダリング ---
  function renderMessages() {
    const container = document.getElementById('chat-container');
    container.innerHTML = '';

    // フィルタリング処理（管理者が特定のユーザーを選んだ場合）
    const displayMsgs = allMessages.filter(m => {
      if (currentFilter === 'ALL') return true;
      return m.senderId === currentFilter;
    });

    displayMsgs.forEach(m => {
      const isMe = m.senderId === myProfile.uid;
      const group = document.createElement('div');
      group.className = `msg-group ${isMe ? 'me' : 'other'}`;

      let body = '';
      if (m.text) body += `<div>${escapeHTML(m.text)}</div>`;
      if (m.file) {
        if (m.file.isImg) {
          body += `<img src="${m.file.url}" class="msg-img" onclick="window.open('${m.file.url}')">`;
        } else {
          body += `<a href="${m.file.url}" download="${m.file.name}" class="msg-file"><span class="material-symbols-rounded">description</span>${escapeHTML(m.file.name)}</a>`;
        }
      }

      group.innerHTML = `
        <div class="msg-sender">${escapeHTML(m.senderName)}</div>
        <div class="msg-wrapper">
          <div class="msg-bubble">${body}</div>
          <div class="msg-meta">
            <span>${m.time}</span>
            ${isMe || myProfile.role === 'admin' ? `<button class="del-btn" onclick="deleteMsg('${m.id}')"><span class="material-symbols-rounded" style="font-size:14px;">delete</span></button>` : ''}
          </div>
        </div>
      `;
      container.appendChild(group);
    });

    container.scrollTop = container.scrollHeight;
  }

  // --- 通知機能 ---
  function enableNotification() {
    if (!("Notification" in window)) return alert('通知非対応のブラウザです');
    Notification.requestPermission().then(p => {
      if (p === "granted") alert('通知がオンになりました！');
    });
  }

  function triggerNotification(title, body) {
    if (Notification.permission === "granted" && document.hidden) {
      new Notification(title, {
        body: body,
        icon: "https://symphony100.github.io/symphony/symphony.png"
      });
    }
  }

  function escapeHTML(str) {
    return (str || '').replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
  }
</script>
</body>
</html>
